name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - name: Check out repository with Git LFS files
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Run tests
        run: >-
          xcodebuild -project LaSay/LaSay.xcodeproj -scheme LaSay
          -destination 'platform=macOS' test
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Build Release
        run: >-
          xcodebuild -project LaSay/LaSay.xcodeproj -scheme LaSay
          -configuration Release -destination 'platform=macOS' build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
